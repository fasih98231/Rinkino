<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          // Global protection against "Uncaught SyntaxError: "undefined" is not valid JSON"
          var origJSONParse = JSON.parse;
          JSON.parse = function(text, reviver) {
            if (text === undefined || text === 'undefined' || text === null || text === '' || text === 'null' || text === '[object Object]') {
              return null;
            }
            return origJSONParse.call(this, text, reviver);
          };

          if (window.Response && window.Response.prototype) {
            var origResponseJson = window.Response.prototype.json;
            window.Response.prototype.json = function() {
              return origResponseJson.call(this).catch(function(err) {
                console.warn('Response.json() parse caught error:', err);
                return {};
              });
            };
          }

          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              console.warn('Intercepted window.fetch override to prevent runtime crash:', val);
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.error('Bypass patch failed:', e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <meta name="description" content="An application built with Google AI Studio." />
    <meta property="og:title" content="My Google AI Studio App" />
    <meta property="og:description" content="An application built with Google AI Studio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
